[package]
name = "wasm-satsview"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A WebAssembly GNSS satellite sky-view control"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
opt-level = "s"
strip = true
